{% extends 'base.html' %}
{% block content %}
<h2>Settings</h2>
<form method="post">
  <label>Crawl rate limit seconds</label>
  <input name="crawl_rate_limit_seconds" value="{{ settings.get('crawl_rate_limit_seconds', '1.5') }}">
  <label>HTTP timeout seconds</label>
  <input name="http_timeout_seconds" value="{{ settings.get('http_timeout_seconds', '15') }}">
  <button type="submit">Save</button>
</form>
{% endblock %}
