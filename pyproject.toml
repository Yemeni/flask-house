[project]
name = "flask-house"
version = "0.1.0"
description = "Kleinanzeigen apartment crawler with POIs and AI notes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "flask>=3.0.0",
  "sqlalchemy>=2.0.0",
  "flask-sqlalchemy>=3.1.1",
  "apscheduler>=3.10.4",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.3",
  "gunicorn>=22.0.0",
  "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
